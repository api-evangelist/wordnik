openapi: 3.0.3
info:
  title: Wordnik
  description: |-
    Wordnik is the world's biggest online English dictionary. The Wordnik API exposes
    word definitions (from five dictionaries), etymologies, real example sentences from
    millions of sources, audio pronunciations, related-word relationships, frequency data,
    hyphenation, phrases, scrabble scores, random words, reverse-dictionary lookup,
    word-of-the-day, and user word lists.
  version: "4.0"
  contact:
    name: Wordnik API Team
    email: apiteam@wordnik.com
    url: https://developer.wordnik.com
  termsOfService: https://www.wordnik.com/about
  license:
    name: Wordnik Terms of Service
    url: https://www.wordnik.com/about
  x-providerName: wordnik.com
  x-apisguru-categories:
    - text
  x-logo:
    url: https://wordnik.com/img/logo-wordnik-home.png
  x-last-validated: "2026-05-29"
  x-origin:
    - format: openapi
      url: https://developer.wordnik.com/api-docs/swagger.json
      version: "2.0"
externalDocs:
  description: Wordnik Developer Documentation
  url: https://developer.wordnik.com
servers:
  - url: https://api.wordnik.com/v4
    description: Wordnik v4 production API
security:
  - api_key: []
tags:
  - name: Word
    description: Operations on a single English word (definitions, etymologies, examples, pronunciations, related words, frequency, hyphenation, phrases, scrabble score, audio).
  - name: Words
    description: Cross-word operations (random words, reverse-dictionary search, full-text search, word-of-the-day).
  - name: Word List
    description: Read and write operations on an individual user word list.
  - name: Word Lists
    description: Create new user word lists.
  - name: Account
    description: API-key status and user authentication operations.
paths:
  "/word.json/{word}/audio":
    get:
      operationId: getAudio
      summary: Fetch Audio Metadata For A Word
      description: |-
        The metadata includes a time-expiring fileUrl which allows reading the audio file
        directly from the API. Currently only audio pronunciations from the American Heritage
        Dictionary in mp3 format are supported.
      tags: [Word]
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      parameters:
        - name: word
          in: path
          required: true
          description: Word to get audio for.
          schema: { type: string, example: "cat" }
        - name: useCanonical
          in: query
          required: false
          description: Return the canonical form of the word (e.g. 'cats' -> 'cat').
          schema: { type: string, enum: ["true", "false"], default: "false" }
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return.
          schema: { type: integer, format: int32, default: 50 }
      responses:
        "200":
          description: Array of AudioFile metadata entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AudioFile" }
  "/word.json/{word}/definitions":
    get:
      operationId: getDefinitions
      summary: Return Definitions For A Word
      description: Returns definitions for the given word from one or more source dictionaries.
      tags: [Word]
      x-microcks-operation: { delay: 0, dispatcher: FALLBACK }
      parameters:
        - { name: word, in: path, required: true, description: Word to return definitions for., schema: { type: string, example: "serendipity" } }
        - { name: limit, in: query, required: false, description: Maximum number of results to return., schema: { type: integer, format: int32, default: 200 } }
        - name: partOfSpeech
          in: query
          required: false
          description: CSV list of part-of-speech types.
          schema:
            type: string
            enum: [noun, adjective, verb, adverb, interjection, pronoun, preposition, abbreviation, affix, article, auxiliary-verb, conjunction, definite-article, family-name, given-name, idiom, imperative, noun-plural, noun-posessive, past-participle, phrasal-prefix, proper-noun, proper-noun-plural, proper-noun-posessive, suffix, verb-intransitive, verb-transitive]
        - { name: includeRelated, in: query, required: false, description: Return related words with definitions., schema: { type: string, default: "false" } }
        - name: sourceDictionaries
          in: query
          required: false
          style: form
          explode: false
          description: Source dictionary to return definitions from. If 'all' is received, results are returned from all sources. If multiple values are received (e.g. 'century,wiktionary'), results are returned from the first specified dictionary that has definitions. If left blank, results are returned from the first dictionary that has definitions. By default, dictionaries are searched in this order:- ahd-5, wiktionary, webster, century, wordnet.
          schema:
            type: array
            items: { type: string, enum: [all, ahd-5, century, wiktionary, webster, wordnet] }
        - { name: useCanonical, in: query, required: false, description: Return the canonical form of the word., schema: { type: string, enum: ["true", "false"], default: "false" } }
        - { name: includeTags, in: query, required: false, description: Return a closed set of XML tags in response., schema: { type: string, enum: ["true", "false"], default: "false" } }
      responses:
        "200":
          description: Array of Definition objects.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Definition" } }
  "/word.json/{word}/etymologies":
    get:
      operationId: getEtymologies
      summary: Fetch Etymology Data For A Word
      description: Returns the etymology entries for a word, typically as XML-tagged strings.
      tags: [Word]
      x-microcks-operation: { delay: 0, dispatcher: FALLBACK }
      parameters:
        - { name: word, in: path, required: true, description: Word to return etymologies for., schema: { type: string, example: "serendipity" } }
        - { name: useCanonical, in: query, required: false, description: Return the canonical form of the word., schema: { type: string, enum: ["true", "false"], default: "false" } }
      responses:
        "200":
          description: Array of etymology strings.
          content:
            application/json:
              schema: { type: array, items: { type: string } }
  "/word.json/{word}/examples":
    get:
      operationId: getExamples
      summary: Return Examples For A Word
      description: Returns real-world example sentences for a word.
      tags: [Word]
      x-microcks-operation: { delay: 0, dispatcher: FALLBACK }
      parameters:
        - { name: word, in: path, required: true, description: Word to return examples for., schema: { type: string, example: "serendipity" } }
        - { name: includeDuplicates, in: query, required: false, description: Show duplicate examples from different sources., schema: { type: string, enum: ["true", "false"], default: "false" } }
        - { name: useCanonical, in: query, required: false, description: Return the canonical form of the word., schema: { type: string, enum: ["true", "false"], default: "false" } }
        - { name: skip, in: query, required: false, description: Results to skip., schema: { type: integer, format: int32, default: 0 } }
        - { name: limit, in: query, required: false, description: Maximum number of results to return., schema: { type: integer, format: int32, default: 5 } }
      responses:
        "200":
          description: ExampleSearchResults payload containing examples and facets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExampleSearchResults" }
  "/word.json/{word}/frequency":
    get:
      operationId: getWordFrequency
      summary: Return Word Usage Over Time
      description: Returns a frequency summary describing how often a word has been used per year.
      tags: [Word]
      x-microcks-operation: { delay: 0, dispatcher: FALLBACK }
      parameters:
        - { name: word, in: path, required: true, description: Word to return., schema: { type: string, example: "serendipity" } }
        - { name: useCanonical, in: query, required: false, description: Return the canonical form of the word., schema: { type: string, enum: ["true", "false"], default: "false" } }
        - { name: startYear, in: query, required: false, description: Starting year., schema: { type: integer, format: int32, default: 1800 } }
        - { name: endYear, in: query, required: false, description: Ending year., schema: { type: integer, format: int32, default: 2012 } }
      responses:
        "200":
          description: Frequency summary for the word.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FrequencySummary" }
  "/word.json/{word}/hyphenation":
    get:
      operationId: getHyphenation
      summary: Return Syllable Information For A Word
      description: Returns the syllabification (hyphenation) data for a word.
      tags: [Word]
      x-microcks-operation: { delay: 0, dispatcher: FALLBACK }
      parameters:
        - { name: word, in: path, required: true, description: Word to get syllables for., schema: { type: string, example: "serendipity" } }
        - { name: useCanonical, in: query, required: false, description: Return the canonical form of the word., schema: { type: string, enum: ["true", "false"], default: "false" } }
        - { name: sourceDictionary, in: query, required: false, description: "Get from a single dictionary. Valid options: ahd-5, century, wiktionary, webster, and wordnet.", schema: { type: string, enum: [ahd-5, century, wiktionary, webster, wordnet] } }
        - { name: limit, in: query, required: false, description: Maximum number of results to return., schema: { type: integer, format: int32, default: 50 } }
      responses:
        "200":
          description: Array of Syllable objects.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Syllable" } }
  "/word.json/{word}/phrases":
    get:
      operationId: getPhrases
      summary: Fetch Bi-gram Phrases For A Word
      description: Returns the top bi-gram phrases that include the given word.
      tags: [Word]
      x-microcks-operation: { delay: 0, dispatcher: FALLBACK }
      parameters:
        - { name: word, in: path, required: true, description: Word to fetch phrases for., schema: { type: string, example: "kick" } }
        - { name: limit, in: query, required: false, description: Maximum number of results to return., schema: { type: integer, format: int32, default: 5 } }
        - { name: wlmi, in: query, required: false, description: Minimum WLMI for the phrase., schema: { type: integer, format: int32, default: 0 } }
        - { name: useCanonical, in: query, required: false, description: Return the canonical form of the word., schema: { type: string, enum: ["true", "false"], default: "false" } }
      responses:
        "200":
          description: Array of Bigram phrase entries.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Bigram" } }
  "/word.json/{word}/pronunciations":
    get:
      operationId: getTextPronunciations
      summary: Return Text Pronunciations For A Word
      description: Returns one or more text pronunciations for a given word in any of the supported formats.
      tags: [Word]
      x-microcks-operation: { delay: 0, dispatcher: FALLBACK }
      parameters:
        - { name: word, in: path, required: true, description: Word to get pronunciations for., schema: { type: string, example: "serendipity" } }
        - { name: useCanonical, in: query, required: false, description: Return the canonical form of the word., schema: { type: string, enum: ["true", "false"], default: "false" } }
        - { name: sourceDictionary, in: query, required: false, description: Get from a single dictionary., schema: { type: string, enum: [ahd-5, century, cmu, macmillan, wiktionary, webster, wordnet] } }
        - { name: typeFormat, in: query, required: false, description: Text pronunciation type., schema: { type: string, enum: [ahd-5, arpabet, gcide-diacritical, IPA] } }
        - { name: limit, in: query, required: false, description: Maximum number of results to return., schema: { type: integer, format: int32, default: 50 } }
      responses:
        "200":
          description: Array of TextPron objects.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TextPron" } }
  "/word.json/{word}/relatedWords":
    get:
      operationId: getRelatedWords
      summary: Return Related Words From The Word Graph
      description: Given a word as a string, returns relationships from the Wordnik Word Graph (synonyms, antonyms, hypernyms, hyponyms, etc.).
      tags: [Word]
      x-microcks-operation: { delay: 0, dispatcher: FALLBACK }
      parameters:
        - { name: word, in: path, required: true, description: Word to fetch relationships for., schema: { type: string, example: "happy" } }
        - { name: useCanonical, in: query, required: false, description: Return the canonical form of the word., schema: { type: string, enum: ["true", "false"], default: "false" } }
        - name: relationshipTypes
          in: query
          required: false
          description: Limits the total results per type of relationship type.
          schema:
            type: string
            enum: [synonym, antonym, variant, equivalent, cross-reference, related-word, rhyme, form, etymologically-related-term, hypernym, hyponym, inflected-form, primary, same-context, verb-form, verb-stem, has_topic]
        - { name: limitPerRelationshipType, in: query, required: false, description: Restrict to the supplied relationship types., schema: { type: integer, format: int32, default: 10 } }
      responses:
        "200":
          description: Array of Related word-group objects.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Related" } }
  "/word.json/{word}/scrabbleScore":
    get:
      operationId: getScrabbleScore
      summary: Return The Scrabble Score For A Word
      description: Returns the scrabble score for a given word.
      tags: [Word]
      x-microcks-operation: { delay: 0, dispatcher: FALLBACK }
      parameters:
        - { name: word, in: path, required: true, description: Word to get scrabble score for., schema: { type: string, example: "quiz" } }
      responses:
        "200":
          description: ScrabbleScoreResult containing a single value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScrabbleScoreResult" }
  "/word.json/{word}/topExample":
    get:
      operationId: getTopExample
      summary: Return A Top Example For A Word
      description: Returns a single top example sentence for a given word.
      tags: [Word]
      x-microcks-operation: { delay: 0, dispatcher: FALLBACK }
      parameters:
        - { name: word, in: path, required: true, description: Word to fetch examples for., schema: { type: string, example: "serendipity" } }
        - { name: useCanonical, in: query, required: false, description: Return the canonical form of the word., schema: { type: string, enum: ["true", "false"], default: "false" } }
      responses:
        "200":
          description: A single Example payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Example" }
  "/words.json/randomWord":
    get:
      operationId: getRandomWord
      summary: Return A Single Random Word
      description: Returns a single random WordObject filtered by part of speech, length, dictionary count, and corpus count.
      tags: [Words]
      x-microcks-operation: { delay: 0, dispatcher: FALLBACK }
      parameters:
        - { name: hasDictionaryDef, in: query, required: false, description: Only return words with dictionary definitions., schema: { type: string, default: "true" } }
        - { name: includePartOfSpeech, in: query, required: false, description: CSV part-of-speech values to include., schema: { type: string } }
        - { name: excludePartOfSpeech, in: query, required: false, description: CSV part-of-speech values to exclude., schema: { type: string } }
        - { name: minCorpusCount, in: query, required: false, description: Minimum corpus frequency for terms., schema: { type: integer, format: int32, default: 0 } }
        - { name: maxCorpusCount, in: query, required: false, description: Maximum corpus frequency for terms., schema: { type: integer, format: int32, default: -1 } }
        - { name: minDictionaryCount, in: query, required: false, description: Minimum dictionary count., schema: { type: integer, format: int32, default: 1 } }
        - { name: maxDictionaryCount, in: query, required: false, description: Maximum dictionary count., schema: { type: integer, format: int32, default: -1 } }
        - { name: minLength, in: query, required: false, description: Minimum word length., schema: { type: integer, format: int32, default: 5 } }
        - { name: maxLength, in: query, required: false, description: Maximum word length., schema: { type: integer, format: int32, default: -1 } }
      responses:
        "200":
          description: A single random WordObject.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WordObject" }
  "/words.json/randomWords":
    get:
      operationId: getRandomWords
      summary: Return An Array Of Random Words
      description: Returns an array of random WordObjects filtered by part of speech, length, dictionary count, and corpus count.
      tags: [Words]
      x-microcks-operation: { delay: 0, dispatcher: FALLBACK }
      parameters:
        - { name: hasDictionaryDef, in: query, required: false, description: Only return words with dictionary definitions., schema: { type: string, default: "true" } }
        - { name: includePartOfSpeech, in: query, required: false, description: CSV part-of-speech values to include., schema: { type: string } }
        - { name: excludePartOfSpeech, in: query, required: false, description: CSV part-of-speech values to exclude., schema: { type: string } }
        - { name: minCorpusCount, in: query, required: false, description: Minimum corpus frequency for terms., schema: { type: integer, format: int32, default: 0 } }
        - { name: maxCorpusCount, in: query, required: false, description: Maximum corpus frequency for terms., schema: { type: integer, format: int32, default: -1 } }
        - { name: minDictionaryCount, in: query, required: false, description: Minimum dictionary count., schema: { type: integer, format: int32, default: 1 } }
        - { name: maxDictionaryCount, in: query, required: false, description: Maximum dictionary count., schema: { type: integer, format: int32, default: -1 } }
        - { name: minLength, in: query, required: false, description: Minimum word length., schema: { type: integer, format: int32, default: 5 } }
        - { name: maxLength, in: query, required: false, description: Maximum word length., schema: { type: integer, format: int32, default: -1 } }
        - { name: sortBy, in: query, required: false, description: Attribute to sort by., schema: { type: string, enum: [alpha, count] } }
        - { name: sortOrder, in: query, required: false, description: Sort direction., schema: { type: string, enum: [asc, desc] } }
        - { name: limit, in: query, required: false, description: Maximum number of results to return., schema: { type: integer, format: int32, default: 10 } }
      responses:
        "200":
          description: Array of random WordObject entries.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/WordObject" } }
  "/words.json/reverseDictionary":
    get:
      operationId: reverseDictionary
      summary: Reverse Dictionary Search
      description: Returns the words that best match a natural-language query string.
      tags: [Words]
      x-microcks-operation: { delay: 0, dispatcher: FALLBACK }
      parameters:
        - { name: query, in: query, required: true, description: Search term., schema: { type: string, example: "feeling of happiness" } }
        - { name: findSenseForWord, in: query, required: false, description: Restricts words and finds closest sense., schema: { type: string } }
        - { name: includeSourceDictionaries, in: query, required: false, description: Only include these comma-delimited source dictionaries., schema: { type: string, enum: [ahd-5, century, cmu, macmillan, wiktionary, webster, wordnet] } }
        - { name: excludeSourceDictionaries, in: query, required: false, description: Exclude these comma-delimited source dictionaries., schema: { type: string, enum: [ahd-5, century, cmu, macmillan, wiktionary, webster, wordnet] } }
        - { name: includePartOfSpeech, in: query, required: false, description: Only include these comma-delimited parts of speech., schema: { type: string } }
        - { name: excludePartOfSpeech, in: query, required: false, description: Exclude these comma-delimited parts of speech., schema: { type: string } }
        - { name: minCorpusCount, in: query, required: false, description: Minimum corpus frequency for terms., schema: { type: integer, format: int32, default: 5 } }
        - { name: maxCorpusCount, in: query, required: false, description: Maximum corpus frequency for terms., schema: { type: integer, format: int32, default: -1 } }
        - { name: minLength, in: query, required: false, description: Minimum word length., schema: { type: integer, format: int32, default: 1 } }
        - { name: maxLength, in: query, required: false, description: Maximum word length., schema: { type: integer, format: int32, default: -1 } }
        - { name: expandTerms, in: query, required: false, description: Expand terms., schema: { type: string } }
        - { name: includeTags, in: query, required: false, description: Return a closed set of XML tags in response., schema: { type: string, enum: ["true", "false"], default: "false" } }
        - { name: sortBy, in: query, required: false, description: Attribute to sort by., schema: { type: string, enum: [alpha, count] } }
        - { name: sortOrder, in: query, required: false, description: Sort direction., schema: { type: string, enum: [asc, desc] } }
        - { name: skip, in: query, required: false, description: Results to skip., schema: { type: string, default: "0" } }
        - { name: limit, in: query, required: false, description: Maximum number of results to return., schema: { type: integer, format: int32, default: 10 } }
      responses:
        "200":
          description: DefinitionSearchResults payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefinitionSearchResults" }
  "/words.json/search/{query}":
    get:
      operationId: searchWords
      summary: Search Words
      description: Searches for words matching the supplied query (literal or regular expression).
      tags: [Words]
      x-microcks-operation: { delay: 0, dispatcher: FALLBACK }
      parameters:
        - { name: query, in: path, required: true, description: Search query., schema: { type: string, example: "ser" } }
        - { name: allowRegex, in: query, required: false, description: Search term is a regular expression., schema: { type: string, default: "false" } }
        - { name: caseSensitive, in: query, required: false, description: Search case sensitive., schema: { type: string, default: "true" } }
        - { name: includePartOfSpeech, in: query, required: false, description: Only include these comma-delimited parts of speech., schema: { type: string } }
        - { name: excludePartOfSpeech, in: query, required: false, description: Exclude these comma-delimited parts of speech., schema: { type: string } }
        - { name: minCorpusCount, in: query, required: false, description: Minimum corpus frequency for terms., schema: { type: integer, format: int32, default: 5 } }
        - { name: maxCorpusCount, in: query, required: false, description: Maximum corpus frequency for terms., schema: { type: integer, format: int32, default: -1 } }
        - { name: minDictionaryCount, in: query, required: false, description: Minimum number of dictionary entries for words returned., schema: { type: integer, format: int32, default: 1 } }
        - { name: maxDictionaryCount, in: query, required: false, description: Maximum dictionary definition count., schema: { type: integer, format: int32, default: -1 } }
        - { name: minLength, in: query, required: false, description: Minimum word length., schema: { type: integer, format: int32, default: 1 } }
        - { name: maxLength, in: query, required: false, description: Maximum word length., schema: { type: integer, format: int32, default: -1 } }
        - { name: skip, in: query, required: false, description: Results to skip., schema: { type: integer, format: int32, default: 0 } }
        - { name: limit, in: query, required: false, description: Maximum number of results to return., schema: { type: integer, format: int32, default: 10 } }
      responses:
        "200":
          description: WordSearchResults payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WordSearchResults" }
  "/words.json/wordOfTheDay":
    get:
      operationId: getWordOfTheDay
      summary: Return The Word Of The Day
      description: Returns the Word of the Day, optionally for a specific date.
      tags: [Words]
      x-microcks-operation: { delay: 0, dispatcher: FALLBACK }
      parameters:
        - { name: date, in: query, required: false, description: Fetches by date in yyyy-MM-dd., schema: { type: string, example: "2026-05-29" } }
      responses:
        "200":
          description: A single WordOfTheDay payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WordOfTheDay" }
  "/account.json/apiTokenStatus":
    get:
      operationId: getApiTokenStatus
      summary: Return API Token Status
      description: Returns the current quota, total requests, and remaining-call status for the supplied API key. Endpoint surface verified from the Wordnik official client SDK (wordnik-clients/java AccountApi).
      tags: [Account]
      x-microcks-operation: { delay: 0, dispatcher: FALLBACK }
      x-schema-source: sdk
      x-sdk-repo: https://github.com/wordnik/wordnik-clients
      parameters:
        - { name: api_key, in: header, required: false, description: Wordnik API key (when not using the query parameter)., schema: { type: string } }
      responses:
        "200":
          description: ApiTokenStatus payload describing the supplied key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiTokenStatus" }
  "/account.json/authenticate/{username}":
    get:
      operationId: authenticate
      summary: Authenticate A User
      description: Authenticates a Wordnik user using the supplied password and returns an auth token for subsequent user-scoped operations.
      tags: [Account]
      x-microcks-operation: { delay: 0, dispatcher: FALLBACK }
      x-schema-source: sdk
      x-sdk-repo: https://github.com/wordnik/wordnik-clients
      parameters:
        - { name: username, in: path, required: true, description: A confirmed Wordnik username., schema: { type: string } }
        - { name: password, in: query, required: true, description: The user's password., schema: { type: string, format: password } }
      responses:
        "200":
          description: AuthenticationToken payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthenticationToken" }
    post:
      operationId: authenticatePost
      summary: Authenticate A User (POST Body)
      description: Same as the GET form, but the password is sent in the request body to avoid logging the credential in URL query strings.
      tags: [Account]
      x-microcks-operation: { delay: 0, dispatcher: FALLBACK }
      x-schema-source: sdk
