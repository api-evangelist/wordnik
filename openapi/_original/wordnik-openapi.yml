components:
  securitySchemes:
    api_key:
      type: apiKey
      name: api_key
      in: query
      description: Wordnik issues per-account API keys; pass via the `api_key` query parameter on every request.
    auth_token:
      type: apiKey
      name: auth_token
      in: header
      description: User auth token returned by `/account.json/authenticate/{username}`; required for user-scoped account and word-list operations.
  schemas:
    ApiTokenStatus:
      type: object
      properties:
        expiresInMillis: { type: integer, format: int64 }
        remainingCalls: { type: integer, format: int64 }
        resetsInMillis: { type: integer, format: int64 }
        token: { type: string }
        totalRequests: { type: integer, format: int64 }
        valid: { type: boolean }
    AudioFile:
      type: object
      required: [id]
      properties:
        attributionText: { type: string }
        attributionUrl: { type: string }
        audioType: { type: string, example: "pronunciation" }
        commentCount: { type: integer, format: int32 }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        description: { type: string }
        duration: { type: number, format: double }
        fileUrl: { type: string, format: uri }
        id: { type: integer, format: int64 }
        voteAverage: { type: number, format: float }
        voteCount: { type: integer }
        voteWeightedAverage: { type: number, format: float }
        word: { type: string }
    AudioType:
      type: object
      properties:
        id: { type: integer, format: int32 }
        name: { type: string }
    AuthenticationToken:
      type: object
      properties:
        token: { type: string }
        userId: { type: integer, format: int64 }
        userSignature: { type: string }
    Bigram:
      type: object
      properties:
        count: { type: integer, format: int64 }
        gram1: { type: string }
        gram2: { type: string }
        mi: { type: number, format: double, description: "Mutual information score" }
        wlmi: { type: number, format: double, description: "Word-list mutual information score" }
    Category:
      type: object
      required: [id]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    Citation:
      type: object
      properties:
        cite: { type: string }
        source: { type: string }
    ContentProvider:
      type: object
      properties:
        id: { type: integer, format: int32 }
        name: { type: string }
    Definition:
      type: object
      properties:
        attributionText: { type: string }
        attributionUrl: { type: string }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        exampleUses:
          type: array
          items: { $ref: "#/components/schemas/ExampleUsage" }
        extendedText: { type: string }
        labels:
          type: array
          items: { $ref: "#/components/schemas/Label" }
        notes:
          type: array
          items: { $ref: "#/components/schemas/Note" }
        partOfSpeech: { type: string }
        relatedWords:
          type: array
          items: { $ref: "#/components/schemas/Related" }
        score: { type: number, format: float }
        seqString: { type: string }
        sequence: { type: string }
        sourceDictionary: { type: string, example: "ahd-5" }
        text: { type: string }
        textProns:
          type: array
          items: { $ref: "#/components/schemas/TextPron" }
        word: { type: string }
    DefinitionSearchResults:
      type: object
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/SimpleDefinition" }
        totalResults: { type: integer, format: int32 }
    Example:
      type: object
      properties:
        documentId: { type: integer, format: int64 }
        exampleId: { type: integer, format: int64 }
        id: { type: integer, format: int64 }
        provider: { $ref: "#/components/schemas/ContentProvider" }
        rating: { type: number, format: float }
        score: { $ref: "#/components/schemas/ScoredWord" }
        sentence: { $ref: "#/components/schemas/Sentence" }
        text: { type: string }
        title: { type: string }
        url: { type: string, format: uri }
        word: { type: string }
        year: { type: integer }
    ExampleSearchResults:
      type: object
      properties:
        examples:
          type: array
          items: { $ref: "#/components/schemas/Example" }
        facets:
          type: array
          items: { $ref: "#/components/schemas/Facet" }
    ExampleUsage:
      type: object
      properties:
        text: { type: string }
    Facet:
      type: object
      properties:
        facetValues:
          type: array
          items: { $ref: "#/components/schemas/FacetValue" }
        name: { type: string }
    FacetValue:
      type: object
      properties:
        count: { type: integer, format: int64 }
        value: { type: string }
    Frequency:
      type: object
      properties:
        count: { type: integer, format: int64 }
        year: { type: integer, format: int32 }
    FrequencySummary:
      type: object
      properties:
        frequency:
          type: array
          items: { $ref: "#/components/schemas/Frequency" }
        frequencyString: { type: string }
        totalCount: { type: integer, format: int64 }
        unknownYearCount: { type: integer, format: int32 }
        word: { type: string }
    Label:
      type: object
      properties:
        text: { type: string }
        type: { type: string }
    Note:
      type: object
      properties:
        appliesTo:
          type: array
          items: { type: string }
        noteType: { type: string }
        pos: { type: integer, format: int32 }
        value: { type: string }
    PartOfSpeech:
      type: object
      properties:
        allCategories:
          type: array
          items: { $ref: "#/components/schemas/Category" }
        roots:
          type: array
          items: { $ref: "#/components/schemas/Root" }
        storageAbbr:
          type: array
          items: { type: string }
    Related:
      type: object
      properties:
        gram: { type: string }
        label1: { type: string }
        label2: { type: string }
        label3: { type: string }
        label4: { type: string }
        relationshipType: { type: string, example: "synonym" }
        words:
          type: array
          items: { type: string }
    Root:
      type: object
      required: [id]
      properties:
        categories:
          type: array
          items: { $ref: "#/components/schemas/Category" }
        id: { type: integer, format: int64 }
        name: { type: string }
    ScrabbleScoreResult:
      type: object
      properties:
        value: { type: integer, format: int64 }
    ScoredWord:
      type: object
      properties:
        baseWordScore: { type: number, format: double }
        docTermCount: { type: integer, format: int32 }
        id: { type: integer, format: int64 }
        lemma: { type: string }
        partOfSpeech: { type: string }
        position: { type: integer, format: int32 }
        score: { type: number, format: float }
        sentenceId: { type: integer, format: int64 }
        stopword: { type: boolean }
        word: { type: string }
        wordType: { type: string }
    Sentence:
      type: object
      properties:
        display: { type: string }
        documentMetadataId: { type: integer, format: int64 }
        hasScoredWords: { type: boolean }
        id: { type: integer, format: int64 }
        rating: { type: integer, format: int32 }
        scoredWords:
          type: array
          items: { $ref: "#/components/schemas/ScoredWord" }
    SimpleDefinition:
      type: object
      properties:
        note: { type: string }
        partOfSpeech: { type: string }
        source: { type: string }
        text: { type: string }
    SimpleExample:
      type: object
      properties:
        id: { type: integer, format: int64 }
        text: { type: string }
        title: { type: string }
        url: { type: string, format: uri }
    StringValue:
      type: object
      properties:
        word: { type: string }
    Syllable:
      type: object
      properties:
        seq: { type: integer, format: int32 }
        text: { type: string }
        type: { type: string, enum: [stress, secondary, normal] }
    TextPron:
      type: object
      properties:
        raw: { type: string }
        rawType: { type: string }
        seq: { type: integer, format: int32 }
    User:
      type: object
      properties:
        displayName: { type: string }
        email: { type: string, format: email }
        faceBookId: { type: string }
        id: { type: integer, format: int64 }
        password: { type: string, format: password }
        status: { type: integer, format: int32 }
        userName: { type: string }
        username: { type: string }
    WordList:
      type: object
      required: [id]
      properties:
        createdAt: { type: string, format: date-time }
        description: { type: string }
        id: { type: integer, format: int64 }
        lastActivityAt: { type: string, format: date-time }
        name: { type: string }
        numberWordsInList: { type: integer, format: int64 }
        permalink: { type: string }
        type: { type: string, enum: [PUBLIC, PRIVATE] }
        updatedAt: { type: string, format: date-time }
        userId: { type: integer, format: int64 }
        username: { type: string }
    WordListWord:
      type: object
      required: [id]
      properties:
        createdAt: { type: string, format: date-time }
        id: { type: integer, format: int64 }
        numberCommentsOnWord: { type: integer, format: int64 }
        numberLists: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        username: { type: string }
        word: { type: string }
    WordObject:
      type: object
      required: [id]
      properties:
        canonicalForm: { type: string }
        id: { type: integer, format: int64 }
        originalWord: { type: string }
        suggestions:
          type: array
          items: { type: string }
        vulgar: { type: string }
        word: { type: string }
    WordOfTheDay:
      type: object
      required: [id]
      properties:
        category: { type: string }
        contentProvider: { $ref: "#/components/schemas/ContentProvider" }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        definitions:
          type: array
          items: { $ref: "#/components/schemas/SimpleDefinition" }
        examples:
          type: array
          items: { $ref: "#/components/schemas/SimpleExample" }
        htmlExtra: { type: string }
        id: { type: integer, format: int64 }
        note: { type: string }
        parentId: { type: string }
        publishDate: { type: string, format: date }
        word: { type: string }
    WordSearchResult:
      type: object
      properties:
        count: { type: integer, format: int64 }
        lexicality: { type: number, format: double }
        word: { type: string }
    WordSearchResults:
      type: object
      properties:
        searchResults:
          type: array
          items: { $ref: "#/components/schemas/WordSearchResult" }
        totalResults: { type: integer, format: int32 }
