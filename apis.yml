features:
  - name: Five Dictionary Sources
    description: >-
      Definitions are drawn from American Heritage (ahd-5), Wiktionary, Webster, Century, and WordNet — selectable per
      request via sourceDictionaries.
  - name: Real-World Example Sentences
    description: >-
      Examples come from millions of sources rather than constructed example text, with citation metadata via
      /word.json/{word}/examples and /topExample.
  - name: Audio Pronunciations
    description: AHD mp3 audio pronunciations exposed via /word.json/{word}/audio with time-expiring fileUrls.
  - name: Word Graph Relationships
    description: Synonym, antonym, hypernym, hyponym, rhyme, and 17 other relationship types via /word.json/{word}/relatedWords.
  - name: Frequency Over Time
    description: Annual usage counts from 1800 onward via /word.json/{word}/frequency for historical / linguistic research.
  - name: Reverse Dictionary
    description: Natural-language query to candidate words via /words.json/reverseDictionary.
  - name: Word Of The Day
    description: Curated daily word with definitions, examples, and editorial notes via /words.json/wordOfTheDay.
  - name: User Word Lists
    description: Authenticated users can create, edit, and curate named word lists via /wordList.json and /wordLists.json.
useCases:
  - name: Dictionary App
    description: Build a consumer-facing dictionary or thesaurus app using definitions, etymologies, pronunciations, and examples.
  - name: Word Games
    description: Power crossword, scrabble, hangman, and word-discovery games using random words, search, and scrabble scoring.
  - name: Vocabulary Learning
    description: >-
      Build a flashcard or vocabulary-coach app using user word lists, word of the day, and definitions across grade
      levels.
  - name: Editorial Tooling
    description: Surface synonyms, antonyms, and reverse-dictionary lookup inside CMS / writing tools.
  - name: Linguistic Research
    description: Use frequency-over-time data and the word-graph for academic linguistics and lexicographic research.
  - name: Children's Education
    description: Use the forthcoming children's / student definitions tier for age-appropriate vocabulary apps.
integrations:
  - name: Python (wordnik-py3)
    description: Official Python 3 client published to PyPI as `wordnik-py3`.
  - name: Ruby (wordnik)
    description: Official Ruby gem published to RubyGems as `wordnik`.
  - name: PHP
    description: Swagger-generated PHP client in wordnik/wordnik-php.
  - name: Java
    description: Swagger-generated Java client in wordnik/wordnik-clients/java.
  - name: Kotlin / Scala / Android / Objective-C
    description: Additional swagger-generated clients in wordnik/wordnik-clients.
solutions:
  - name: Dictionary-Of-Record Integration
    description: >-
      Use Wordnik as the canonical dictionary for a product surface, hitting /word.json/{word}/definitions with
      sourceDictionaries selection logic.
  - name: Quota-Aware Caching Layer
    description: >-
      Cache results aggressively per-word and use /account.json/apiTokenStatus telemetry plus X-RateLimit headers to
      right-size the Hobby / Pro / Enterprise tier.
