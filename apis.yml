apis:
  - name: Wordnik
    description: >-
      The v4 Wordnik API exposes single-word lookups (definitions, etymologies, examples, pronunciations, related words,
      frequency, hyphenation, phrases, scrabble score, audio), cross-word discovery (random word, search, reverse
      dictionary, word of the day), and authenticated user word-list management. Authentication is a single api_key
      query parameter; user-scoped operations require an auth_token header obtained via /account.json/authenticate.
    humanURL: https://developer.wordnik.com
    baseURL: https://api.wordnik.com/v4
