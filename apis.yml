aid: wordnik
name: Wordnik
description: >-
  Wordnik is the largest online English dictionary by number of words. Its v4 REST API exposes definitions from five
  dictionaries, etymologies, real example sentences from millions of sources, audio pronunciations, related-word
  relationships, frequency over time, hyphenation, bi-gram phrases, scrabble scores, random words, reverse-dictionary
  lookup, word-of-the-day, and authenticated user word lists.
